name: Bug Report
description: Report a reproducible bug or defect in Stacked UI
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and resolve it quickly.
  - type: input
    id: component
    attributes:
      label: Affected Component(s) or Package(s)
      description: e.g. Button, Dialog, Select, or stackedui-cli
      placeholder: Button, Dialog
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippet to reproduce the behavior.
      placeholder: |
        1. Import `Button` from `stackedui`
        2. Set prop `variant="outline"`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: React version, Next.js / Vite version, Tailwind version, browser, OS.
      placeholder: React 19, Next.js 15, Tailwind CSS v4, macOS / Chrome
    validations:
      required: false
